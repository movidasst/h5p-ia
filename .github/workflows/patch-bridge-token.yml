name: Patch bridge token compatibility
on:
  push:
    branches: [ux-simple-v3]
    paths:
      - 'scripts/patch-bridge-token.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch-bridge-token.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Confirm auth module untouched
        run: git diff --exit-code HEAD -- auth.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Harden Moodle bridge token transport"
          git push origin ux-simple-v3
