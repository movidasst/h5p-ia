name: Integrate H5P Drive backup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-drive-h5p.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 .github/scripts/integrate_drive.py

      - name: Validation 1 - JavaScript syntax
        run: node --check app.js

      - name: Validation 2 - required integration and preview removal
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'H5PIA_PREVIEW_V130' app.js
          grep -q 'AKfycbweUDHocCNItLciLJr9ujg-FHIYU0h-733c2E1esv3TbC7rz4OEYAWS6K2QtGmO9g72' app.js
          grep -q 'saveValidatedH5pToDrive' app.js
          grep -q 'publish.hidden = true' app.js

      - name: Validation 3 - structural assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(encoding='utf-8')
          assert s.count('async function downloadH5P()') == 1
          assert s.count('function bind()') == 1
          assert 'H5PIA_PREVIEW_V130' not in s
          assert 'saveValidatedH5pToDrive' in s
          assert 'lastValidatedH5p' in s
          print('validation-3-ok')
          PY
          git diff --check

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Integrate safe Google Drive backup for validated H5P'
          git push
