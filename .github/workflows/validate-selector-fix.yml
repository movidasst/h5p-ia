name: Validate selector lock fix
on:
  push:
    branches: [ fix-selector-lock ]
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python scripts/fix-selector-lock.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check selector contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(encoding='utf-8')
          assert "const requestedChoice = $('library').value;" in s
          assert "$('library').value = proposal.machineName" not in s
          assert "requestedChoice !== '__AUTO__'" in s
          assert "La IA propone:" in s
          print('Selector contract OK')
          PY
      - name: Commit validated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet || git commit -m "Fix H5P selector auto-mode lock"
          git push
