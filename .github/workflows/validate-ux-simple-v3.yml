name: Validate simple H5P UX
on:
  push:
    branches: [ux-simple-v3]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check auth.js
          node --check catalog-h5p.js
          node --check app.js
      - name: Check critical UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          ids=['loginView','appView','loginForm','loginEmail','loginPassword','loginError','adminEmail','logoutBtn','moodleStatus','library','topic','proposalBtn','proposalPanel','confirmBtn','resultPanel','downloadH5pBtn','publishBtn','resultJson']
          missing=[x for x in ids if f'id="{x}"' not in s]
          if missing:
              raise SystemExit('Missing IDs: '+', '.join(missing))
          if 'activityChooser' in s or 'activityGrid' in s:
              raise SystemExit('Old card gallery still present')
          if 'id="objective"' in s:
              raise SystemExit('Duplicate objective input still present')
          order=['./auth.js','./catalog-h5p.js','./app.js']
          positions=[s.find(x) for x in order]
          if -1 in positions or positions != sorted(positions):
              raise SystemExit('Script order invalid')
          print('UX_CONTRACT_OK')
          PY
