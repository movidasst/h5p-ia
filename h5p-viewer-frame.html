<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Vista previa H5P</title>
  <link rel="stylesheet" href="/assets/h5p-standalone/styles/h5p.css">
  <style>
    html,body{margin:0;min-height:100%;background:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17324a}
    #player{width:100%;min-height:240px}
    #state{padding:24px;text-align:center;color:#64748b;font-weight:700;line-height:1.5}
    #state.error{color:#9b1c1c;background:#fff4f4;border:1px solid #ffd7d7;border-radius:12px;margin:12px;text-align:left}
  </style>
</head>
<body>
  <div id="state">Preparando actividad H5P…</div>
  <div id="player"></div>
  <script src="/assets/h5p-standalone/main.bundle.js"></script>
  <script>
  (()=>{
    'use strict';
    const state=document.getElementById('state');
    const player=document.getElementById('player');
    const send=(type,payload={})=>{
      try{ parent.postMessage({source:'movidasst-h5p-viewer',type,...payload},location.origin); }catch(_){}
    };
    const fail=(error)=>{
      const message=String(error?.message||error||'No se pudo reproducir este H5P.');
      state.hidden=false;
      state.className='error';
      state.textContent='⚠ '+message;
      send('error',{message});
    };
    async function waitForController(){
      if(!('serviceWorker' in navigator)) throw new Error('El navegador no admite el sistema de vista previa local.');
      await navigator.serviceWorker.ready;
      if(navigator.serviceWorker.controller) return;
      await Promise.race([
        new Promise(resolve=>navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true})),
        new Promise(resolve=>setTimeout(resolve,3000))
      ]);
      if(!navigator.serviceWorker.controller){
        const key='h5p_viewer_reloaded';
        if(sessionStorage.getItem(key)!=='1'){
          sessionStorage.setItem(key,'1');
          location.reload();
          await new Promise(()=>{});
        }
        sessionStorage.removeItem(key);
        throw new Error('El visor local no pudo controlar esta página. Recarga la aplicación e inténtalo otra vez.');
      }
      sessionStorage.removeItem('h5p_viewer_reloaded');
    }
    async function assertFetch(url,label){
      const response=await fetch(url,{cache:'no-store'});
      if(!response.ok) throw new Error(`${label} no está disponible para el reproductor (HTTP ${response.status}).`);
      const text=await response.text();
      try{return JSON.parse(text);}catch(_){throw new Error(`${label} no contiene JSON válido.`);}
    }
    async function start(){
      try{
        const qs=new URLSearchParams(location.search);
        const base=String(qs.get('base')||'').replace(/\/$/,'');
        if(!base.startsWith('/__h5p_preview__/')) throw new Error('Ruta de vista previa inválida.');
        await waitForController();
        state.textContent='Comprobando archivos H5P…';
        const h5p=await assertFetch(base+'/h5p.json','h5p.json');
        await assertFetch(base+'/content/content.json','content/content.json');
        if(!window.H5PStandalone?.H5P) throw new Error('El motor H5P Standalone no se cargó.');
        state.textContent=`Cargando ${h5p.mainLibrary||'actividad H5P'}…`;
        await new window.H5PStandalone.H5P(player,{
          h5pJsonPath:base,
          contentJsonPath:base+'/content',
          librariesPath:base,
          frameJs:'/assets/h5p-standalone/frame.bundle.js',
          frameCss:'/assets/h5p-standalone/styles/h5p.css',
          frame:true,
          copyright:true,
          export:false,
          icon:false,
          fullScreen:true,
          reportingIsEnabled:true
        });
        state.hidden=true;
        send('ready',{mainLibrary:String(h5p.mainLibrary||'')});
      }catch(error){fail(error);}
    }
    start();
  })();
  </script>
</body>
</html>
