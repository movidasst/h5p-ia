name: Hotfix catalog and H5P viewer V2

on:
  push:
    paths:
      - '.github/workflows/hotfix-catalog-viewer-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply isolated hotfixes
        run: |
          python3 scripts/hotfix-local-catalog-viewer-v2.py
          python3 scripts/fix-viewer-embed-div.py
          python3 scripts/fix-h5p-contenttype-compat.py

      - name: Validation 1 - JavaScript syntax and auth isolation
        run: |
          node --check app.js
          node --check h5p-compat.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('h5p-viewer-frame.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,flags=re.S|re.I)
          if not blocks: raise SystemExit('No inline viewer script found')
          Path('/tmp/h5p-viewer-frame.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/h5p-viewer-frame.js
          git diff --exit-code -- auth.js

      - name: Validation 2 - catalog, isolation and viewer assertions
        run: |
          grep -q 'H5P_CATALOG_VIEWER_HOTFIX_V2' app.js
          grep -q 'function localCatalogLibraries' app.js
          grep -q 'Catálogo H5P local' app.js
          grep -q 'h5p-viewer-frame.html' app.js
          grep -q 'await result' app.js
          grep -q 'await new window.H5PStandalone.H5P' h5p-viewer-frame.html
          grep -q "embedType:'div'" h5p-viewer-frame.html
          grep -q "customJs:'/h5p-compat.js'" h5p-viewer-frame.html
          grep -q "player.querySelector('.h5p-content')" h5p-viewer-frame.html
          grep -q '__movidaContentTypeCompatV1' h5p-compat.js
          grep -q 'Object.defineProperty(constructor.prototype' h5p-compat.js
          ! grep -q 'No se pudo conectar con Moodle. Pulsa Actualizar.' app.js
          ! grep -q 'Conectando con Moodle' index.html
          ! grep -q 'Solo verás actividades instaladas en tu Moodle' index.html

      - name: Validation 3 - strict real H5P playback and ES6 compatibility
        run: |
          set -e
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/tunapanda/h5p-standalone/master/test/h5p-test.h5p' -o test-fixture.h5p
          cat > viewer-smoke.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><script src="/assets/vendor/jszip-3.10.1.min.js"></script></head><body><div id="result">starting</div><script>
          (async()=>{
            const finish=(result,message='')=>{document.documentElement.dataset.result=result;document.getElementById('result').textContent=result+':'+message;};
            try{
              await navigator.serviceWorker.register('/h5p-preview-sw.js',{scope:'/'});await navigator.serviceWorker.ready;
              const blob=await (await fetch('/test-fixture.h5p')).blob();
              const zip=await JSZip.loadAsync(blob,{checkCRC32:true});
              const cache=await caches.open('movidasst-h5p-preview-v1');
              for(const req of await cache.keys()) await cache.delete(req);
              const base='/__h5p_preview__/smoke-v2';
              const mime=p=>{const e=p.split('.').pop().toLowerCase();return ({json:'application/json; charset=utf-8',js:'application/javascript; charset=utf-8',css:'text/css; charset=utf-8',svg:'image/svg+xml',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',woff:'font/woff',woff2:'font/woff2',ttf:'font/ttf',mp3:'audio/mpeg',mp4:'video/mp4'})[e]||'application/octet-stream';};
              const enc=p=>p.split('/').map(encodeURIComponent).join('/');
              for(const name of Object.keys(zip.files)){
                const entry=zip.files[name];if(entry.dir)continue;
                const data=await entry.async('arraybuffer');
                await cache.put(new Request(location.origin+base+'/'+enc(name)),new Response(data,{headers:{'Content-Type':mime(name),'Cache-Control':'no-store'}}));
              }
              const frame=document.createElement('iframe');frame.style.width='800px';frame.style.height='700px';document.body.appendChild(frame);
              const timer=setTimeout(()=>finish('error','timeout'),20000);
              window.addEventListener('message',e=>{
                if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.source!=='movidasst-h5p-viewer')return;
                clearTimeout(timer);
                if(e.data.type==='ready' && e.data.rendered===true) finish('ready',e.data.mainLibrary||'');
                else finish('error',e.data.message||'viewer error');
              });
              frame.src='/h5p-viewer-frame.html?base='+encodeURIComponent(base);
            }catch(e){finish('error',e.message||String(e));}
          })();
          </script></body></html>
          EOF
          cat > compat-smoke.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"></head><body><div id="result">starting</div><script src="/assets/h5p-standalone/frame.bundle.js"></script><script src="/h5p-compat.js"></script><script>
          (()=>{
            try{
              class NativeCompatTest extends H5P.EventDispatcher {
                constructor(){
                  super();
                  this.compatReady = typeof this.setActivityStarted === 'function' && typeof this.isRoot === 'function';
                }
                attach(){}
              }
              H5P.NativeCompatTest = NativeCompatTest;
              const descriptor = Object.getOwnPropertyDescriptor(H5P.NativeCompatTest,'prototype');
              const instance = H5P.newRunnable({library:'H5P.NativeCompatTest 1.0',params:{}},'compat-1',undefined,true,{standalone:true});
              const ok = descriptor && descriptor.writable === false && instance && instance.compatReady === true && typeof instance.setActivityStarted === 'function';
              document.documentElement.dataset.result = ok ? 'ready' : 'error';
              document.getElementById('result').textContent = ok ? 'ready' : 'error';
            }catch(error){
              document.documentElement.dataset.result='error';
              document.getElementById('result').textContent='error:'+String(error?.message||error);
            }
          })();
          </script></body></html>
          EOF
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/h5p-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p /tmp/h5p-puppeteer
          npm install --prefix /tmp/h5p-puppeteer --no-save --package-lock=false puppeteer-core@24.16.0 >/tmp/npm-puppeteer.log 2>&1
          cat > /tmp/h5p-viewer-test.cjs <<'NODE'
          const puppeteer=require('/tmp/h5p-puppeteer/node_modules/puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-gpu']});
            const page=await browser.newPage();
            const logs=[];
            const previewFailures=[];
            const fatal=[];
            page.on('console',m=>{
              const text=m.text();
              logs.push('console '+m.type()+': '+text);
              if(/Unable to find constructor|TypeError:|ReferenceError:/i.test(text)) fatal.push(text);
            });
            page.on('pageerror',e=>{logs.push('pageerror: '+e.message);fatal.push(e.message);});
            page.on('requestfailed',r=>{
              const item=r.url()+' '+(r.failure()?.errorText||'');
              logs.push('requestfailed: '+item);
              if(r.url().includes('/__h5p_preview__/')) previewFailures.push(item);
            });
            await page.goto('http://127.0.0.1:8080/viewer-smoke.html',{waitUntil:'networkidle2',timeout:30000});
            await page.waitForFunction(()=>['ready','error'].includes(document.documentElement.dataset.result),{timeout:30000});
            await new Promise(resolve=>setTimeout(resolve,1200));
            const result=await page.evaluate(()=>({result:document.documentElement.dataset.result,text:document.getElementById('result').textContent,frames:[...document.querySelectorAll('iframe')].length}));
            const viewerFrame=page.frames().find(f=>f.url().includes('/h5p-viewer-frame.html'));
            const rendered=viewerFrame ? Boolean(await viewerFrame.$('.h5p-content')) : false;
            const mainInteractive=viewerFrame ? await viewerFrame.evaluate(()=>Boolean(document.querySelector('.h5p-content')?.children.length)) : false;
            console.log(JSON.stringify({...result,rendered,mainInteractive,previewFailures,fatal}));
            if(logs.length) console.log(logs.join('\n'));
            await browser.close();
            if(result.result!=='ready' || !rendered || !mainInteractive || previewFailures.length || fatal.length) process.exit(2);
          })().catch(e=>{console.error(e);process.exit(3);});
          NODE
          CHROME_BIN="$CHROME" node /tmp/h5p-viewer-test.cjs
          cat > /tmp/h5p-compat-test.cjs <<'NODE'
          const puppeteer=require('/tmp/h5p-puppeteer/node_modules/puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-gpu']});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8080/compat-smoke.html',{waitUntil:'networkidle2',timeout:30000});
            await page.waitForFunction(()=>['ready','error'].includes(document.documentElement.dataset.result),{timeout:15000});
            const result=await page.evaluate(()=>({result:document.documentElement.dataset.result,text:document.getElementById('result').textContent}));
            console.log(JSON.stringify({...result,errors}));
            await browser.close();
            if(result.result!=='ready' || errors.length) process.exit(4);
          })().catch(e=>{console.error(e);process.exit(5);});
          NODE
          CHROME_BIN="$CHROME" node /tmp/h5p-compat-test.cjs
          rm -f viewer-smoke.html compat-smoke.html test-fixture.h5p

      - name: Commit only fully validated production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html catalog-h5p.js h5p-viewer-frame.html h5p-compat.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add H5P ContentType compatibility to local viewer'
            git push
          fi
