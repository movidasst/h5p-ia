name: Add H5P preview UI

on:
  push:
    paths:
      - ".github/workflows/add-h5p-preview.yml"
      - "scripts/apply-preview-patch.mjs"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply preview patch
        run: node scripts/apply-preview-patch.mjs
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit preview UI
        run: |
          if git diff --quiet -- app.js; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Add Moodle H5P preview before publishing"
          git push
