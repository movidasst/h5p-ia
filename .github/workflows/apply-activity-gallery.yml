name: Apply visual H5P activity gallery
on:
  push:
    branches:
      - activity-gallery-safe
    paths:
      - '.github/workflows/apply-activity-gallery.yml'
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activity-gallery-safe
      - name: Apply deterministic patch
        run: python .github/scripts/apply_gallery.py
      - name: Validate JavaScript
        run: |
          node --check auth.js
          node --check catalog-h5p.js
          node --check app.js
          node --check activity-gallery.js
      - name: Validate required UI
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['loginForm','activityChooser','activitySearch','activityCategories','activityGrid','activityEmpty','selectedActivityStatus','library','version','recommendBtn','generateBtn']
          missing=[x for x in required if f'id="{x}"' not in s]
          if missing:
              raise SystemExit('Faltan IDs: '+', '.join(missing))
          if './activity-gallery.js' not in s:
              raise SystemExit('Falta activity-gallery.js')
          print('UI_OK')
          PY
      - name: Commit validated gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add visible H5P activity gallery"
          git push origin activity-gallery-safe
