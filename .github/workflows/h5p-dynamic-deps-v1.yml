name: H5P viewer dynamic dependencies V1

on:
  push:
    paths:
      - '.github/workflows/h5p-dynamic-deps-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply isolated viewer patch
        run: python3 scripts/fix-viewer-dynamic-dependencies.py

      - name: Check 1 - syntax and production isolation
        run: |
          node --check app.js
          git diff --exit-code -- auth.js
          ! git diff --name-only | grep -E '^(auth\.js|catalog-h5p\.js|index\.html)$'

      - name: Check 2 - reproduce Humo BranchingScenario dependency gap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('app.js').read_text(encoding='utf-8')
          start=text.index('// H5P_VIEWER_DYNAMIC_DEPS_V1')
          end=text.index('async function cacheH5pPackage',start)
          helper=text[start:end]
          fixture=r'''
          const manifest={
            mainLibrary:'H5P.BranchingScenario',
            preloadedDependencies:[
              {machineName:'H5P.BranchingScenario',majorVersion:1,minorVersion:11},
              {machineName:'FontAwesome',majorVersion:4,minorVersion:5}
            ]
          };
          const content={branchingScenario:{content:[
            {type:{library:'H5P.CoursePresentation 1.27',params:{presentation:{slides:[{elements:[{action:{library:'H5P.Image 1.1',params:{}}},{action:{library:'H5P.AdvancedText 1.1',params:{}}}]}]}}}},
            {type:{library:'H5P.BranchingQuestion 1.0',params:{}}},
            {type:{library:'H5P.AdvancedText 1.1',params:{}}}
          ]}};
          const paths=new Set([
            'H5P.BranchingScenario-1.11/library.json','FontAwesome-4.5/library.json',
            'H5P.CoursePresentation-1.27/library.json','H5P.Image-1.1/library.json',
            'H5P.AdvancedText-1.1/library.json','H5P.BranchingQuestion-1.0/library.json'
          ]);
          const result=h5pAugmentManifestForStandalone(manifest,content,paths);
          const keys=new Set(result.manifest.preloadedDependencies.map(d=>`${d.machineName}@${d.majorVersion}.${d.minorVersion}`));
          const required=['H5P.CoursePresentation@1.27','H5P.Image@1.1','H5P.AdvancedText@1.1','H5P.BranchingQuestion@1.0'];
          if(result.added!==4) throw new Error(`Expected 4 dynamic deps, got ${result.added}`);
          for(const key of required) if(!keys.has(key)) throw new Error(`Missing ${key}`);
          if(manifest.preloadedDependencies.length!==2) throw new Error('Original manifest was mutated');
          console.log(JSON.stringify({added:result.added,required:[...keys].filter(x=>required.includes(x))}));
          '''
          Path('/tmp/h5p-dynamic-test.js').write_text(helper+'\n'+fixture,encoding='utf-8')
          PY
          node --check /tmp/h5p-dynamic-test.js
          node /tmp/h5p-dynamic-test.js

      - name: Check 3 - missing embedded library produces explicit error
        run: |
          cat >> /tmp/h5p-dynamic-test.js <<'NODE'
          (()=>{
            const manifest={mainLibrary:'H5P.BranchingScenario',preloadedDependencies:[{machineName:'H5P.BranchingScenario',majorVersion:1,minorVersion:11}]};
            const content={x:{library:'H5P.CoursePresentation 1.27'}};
            const paths=new Set(['H5P.BranchingScenario-1.11/library.json']);
            let ok=false;
            try{h5pAugmentManifestForStandalone(manifest,content,paths)}catch(e){ok=/CoursePresentation 1\.27/.test(String(e.message));}
            if(!ok) throw new Error('Missing standalone library was not detected explicitly');
            console.log('explicit missing-library error: OK');
          })();
          NODE
          node /tmp/h5p-dynamic-test.js

      - name: Check 4 - viewer runtime and manifest cache invariants
        run: |
          grep -q 'H5P_VIEWER_DYNAMIC_DEPS_V1' app.js
          grep -q 'h5pAugmentManifestForStandalone(h5pJson,contentJson,pathSet)' app.js
          grep -q "h5pEncodedPath('h5p.json')" app.js
          grep -q 'dynamicDependenciesAdded:dependencyResolution.added' app.js
          grep -q "embedType:'div'" h5p-viewer-frame.html
          grep -q "customJs:'/h5p-compat.js'" h5p-viewer-frame.html
          node --check h5p-compat.js

      - name: Commit only fully validated production file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          if git diff --cached --quiet; then
            echo 'No production changes to commit'
          else
            git commit -m 'Resolve dynamic H5P dependencies in local viewer'
            git push
          fi
